<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Permite que a página se adapte a celulares e computadores. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título exibido na aba do navegador. -->
    <title>Patinhas</title>
    <!-- Importa o arquivo responsável pelo estilo da página. -->

</head>

        <h1>Patinhas Saudáveis!</h1>

        <p>Controle de Nutrição</p>

                Sistema para controle e acompanhamento da saúde nutricional do seu pet.
            </p>

            <button onclick="mostrarMensagem()" >
                <img src="img/pata.jpeg"  width="50" height="50">
               
            </button>

        </p>
        <img src="img/pata.jpeg"  width="50" height="50">
